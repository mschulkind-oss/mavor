version: 2
project_name: mavor
# Build output goes in its own subdirectory because dist/ is a source tree
# here: dist/pypi holds the PyPI wrapper. Only the generated half is ignored.
dist: dist/goreleaser

before:
  hooks:
    - go mod tidy
    - go vet ./...
    # mavor is a cgo program that links sherpa-onnx, and the two shared
    # objects that entails are vendored inside the Go module cache rather than
    # in this repo. Stage them where the archive can pick them up.
    #
    # dist/sherpa-lib rather than dist/goreleaser/lib on purpose: `--clean`
    # wipes the configured `dist` directory and `before` hooks run ahead of
    # that, so anything staged inside it would be gone before the archive is
    # built. The script is shared with `just build`, so the release and a
    # local build ship the same set of libraries.
    - bash scripts/sherpa-libs.sh dist/sherpa-lib

builds:
  - id: mavor
    main: ./cmd/mavor
    binary: mavor
    ldflags:
      - -s -w
      - -X main.Version={{.Tag}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}
      # Without this the linker records an absolute path into the *runner's*
      # Go module cache as the RUNPATH, and the released binary starts on no
      # machine but the one that built it. $ORIGIN covers the flat archive
      # layout (binary and shared objects side by side); $ORIGIN/../lib covers
      # the split layout the Homebrew formula installs.
      - -r $ORIGIN:$ORIGIN/../lib
    env:
      # There is one build and it is cgo: the in-process sherpa-onnx
      # recognizers are always linked in. A C toolchain is a build
      # requirement, which ubuntu-latest satisfies with its preinstalled gcc.
      - CGO_ENABLED=1
    # Linux only because that is what has a backend today: the overlay's
    # shared-memory buffers are memfd, so a darwin build does not currently
    # compile. Widen this list when another platform's overlay and emitter
    # exist — nothing else here is Linux-specific.
    goos:
      - linux
    # amd64 only, and that is an unanswered question rather than a decision.
    #
    # cgo cannot cross-compile to arm64 from the amd64 runner: `go build` with
    # GOARCH=arm64 fails in runtime/cgo with `gcc_arm64.S:30: Error: no such
    # instruction`. arm64 needs either a native arm64 runner or an
    # aarch64-linux-gnu cross toolchain installed in the release workflow, and
    # nobody has chosen which. Until then the arch is absent from releases —
    # the PyPI wrapper says so, and an arm64 user builds from source.
    goarch:
      - amd64

archives:
  - id: default
    formats: ["tar.gz"]
    name_template: "mavor_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The distribution unit is a directory, not a file: `mavor` does not start
    # without these two beside it. They land at the archive root, next to the
    # binary, which is the layout the $ORIGIN RUNPATH above expects.
    files:
      - src: dist/sherpa-lib/*.so
        dst: "."
        strip_parent: true
        info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

release:
  # Idempotent. A tag created by `gh release create` already has a release
  # attached, and the default mode fails on that instead of filling it in —
  # which is exactly how v0.1.0 ended up published with zero assets.
  mode: replace

# `brews` is deprecated in favour of `homebrew_casks`, and that deprecation is
# ignored deliberately: casks are macOS-only, and mavor is a Linux-only Wayland
# program. A formula is the only Homebrew artifact that can install it, so this
# stays until goreleaser offers a non-deprecated way to emit one.
brews:
  - name: mavor
    repository:
      owner: mschulkind-oss
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/mschulkind-oss/mavor"
    # Under 80 characters: brew style's FormulaAudit/Desc rejects longer, and
    # the previous wording was 92.
    description: "Local, low-latency voice dictation — hotkey to talk, text lands where you type"
    license: "Apache-2.0"
    directory: Formula
    # All three are in homebrew/core with Linux bottles, so the formula can
    # own the whole runtime rather than leaving them to the reader.
    dependencies:
      - name: whisper-cpp
      - name: wl-clipboard
      - name: wtype
    # Not `bin.install "mavor"` alone: the binary is dynamically linked
    # against sherpa-onnx and would abort at startup with the shared objects
    # left in the Cellar's root. lib.install puts them at <prefix>/lib, which
    # is exactly the $ORIGIN/../lib entry in the binary's RUNPATH.
    install: |
      bin.install "mavor"
      lib.install "libonnxruntime.so", "libsherpa-onnx-c-api.so"
    caveats: |
      mavor needs a Wayland compositor implementing wlr-layer-shell and
      virtual-keyboard-v1: sway, Hyprland, river, Wayfire, niri, labwc. It
      does not work under GNOME, which implements neither.

      Get started with:
        mavor setup     # scaffold config, install tools, fetch a model
        mavor doctor    # check the environment
    test: |
      system "#{bin}/mavor", "version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
