# ───────────────────────────────────────────────────────────────
# YOLO Jail workspace config.  First-time agents: run `yolo --help`
# for an overview of commands, `yolo config-ref` for the full field
# reference, and `yolo check` after every edit to this file.
# ───────────────────────────────────────────────────────────────

# Container runtime: "podman", "docker", or "container" (Apple)
# (also settable via YOLO_RUNTIME env var)
# runtime = "podman"

# Extra host paths to mount read-only into the jail for context.
# Each entry is a host path (mounted at /ctx/<basename>) or "host:container".
# Pass --mount/-m on `yolo init` to populate this automatically, e.g.
#   yolo init -m ~/code/shared-lib -m ~/notes
#
# Read-only views of the developer's own mavor installation, so an agent
# can diagnose a live daemon instead of guessing at it. Logs need no mount:
# mavor runs as a systemd user service, and the `journal` loophole above
# already reaches them with `yolo-journalctl --user -u mavor`.
#
# Explicit host:container form on both, because the basename is taken after
# symlink resolution and these paths are ones we quote back to people.
mounts = [
  # The active config, plus any vocabulary file beside it. This is the file
  # `mavor config show` resolves, and the thing to compare against
  # `defaultConfigTemplate()` when a user's behaviour disagrees with a
  # default.
  "~/.dotfiles/config/mavor:/ctx/mavor-config",
  # The model cache. Needed to tell "the companion is not installed" apart
  # from "it is installed but its ONNX files are truncated" — the two look
  # identical from the outside and only the second is a download bug.
  "~/.cache/mavor/models:/ctx/mavor-models",
]

# Extra nix packages to include in the jail image.
# Names must match nixpkgs attribute names (search at https://search.nixos.org/packages).
# The image rebuilds only when this list changes.
[install]
nix = [
  # Wayland compositor (used headless for tests; also lets devs preview)
  "sway",
  "waybar",
  "wayland",
  "wayland-protocols",
  "xkeyboard-config",
  # Wayland tools
  "grim",         # screenshots (test assertions)
  "slurp",        # region selection (debugging)
  "wtype",        # synthetic typing into focused window
  "wl-clipboard", # wl-copy / wl-paste
  # mavor itself needs no GUI toolkit: the overlay speaks wlr-layer-shell
  # directly and is painted in Go, and mavor is a cgo program that links
  # sherpa-onnx, whose Go binding vendors its own prebuilt shared objects.
  # A C toolchain and pkg-config have to be here for `just build`.
  "pkg-config",
  # Rewrites the built binary's RUNPATH: sherpa-onnx-go's cgo directive
  # bakes its absolute module-cache path into the link, and patchelf removes
  # it. `just build` and the goreleaser `after` hook both call
  # scripts/fix-rpath.sh.
  "patchelf",
  # GTK4 is here for the TESTS, not for mavor. The storybook harness compiles
  # test/gnome/client/consumer.c with `cc` and `pkg-config --cflags --libs
  # gtk4`, then runs that binary as the staged background application. Without
  # it, `just storybook` and the two desktop-staging integration tests die at
  # their "storybook GTK prerequisite" check. Both outputs are needed: .dev
  # supplies gtk4.pc and the headers to compile against, and the default
  # output supplies the shared libraries the compiled client loads at run
  # time (the harness sets GSK_RENDERER=cairo, so no GPU path is pulled in).
  "gtk4",
  "gtk4.dev",
  # Audio stack (headless-capable via null-sink + virtual sources)
  "pipewire",
  "wireplumber",
  "pulseaudio", # pactl + parec utilities
  "dbus",
  "ffmpeg", # WAV conversion / test fixture generation
  # Speech-to-text
  "whisper-cpp", # provides whisper-cli; models downloaded separately
  # GPU benchmarking. The nixpkgs whisper-cpp is CPU-only — it loads
  # libggml-cpu-*.so and nothing else — so measuring the GPU path means
  # building whisper.cpp ourselves with -DGGML_VULKAN=ON. cmake/ninja build
  # it, shaderc's glslc compiles GGML's compute shaders, and mesa supplies
  # the RADV ICD that turns the passed-through /dev/dri node into a Vulkan
  # device. vulkan-tools is for `vulkaninfo`, which is how we prove the
  # device is really there before trusting a number.
  "cmake",
  "ninja",
  # shaderc's default output carries no binaries; glslc lives in "bin",
  # and the Vulkan backend's shader generator shells out to it by name.
  { name = "shaderc", outputs = ["out", "bin", "lib", "dev"] },
  "vulkan-headers",
  "spirv-headers", # ggml-vulkan's CMake find_package()s these directly
  "vulkan-loader",
  "vulkan-tools",
  "mesa",
  # Process supervisor for the dev/test harness
  "hivemind",
  # Build / task runner used by the project's justfile
  "just",
  # Homebrew's own commands (`brew style`, `brew audit`) refuse to run
  # without Ruby 4, and it cannot bootstrap its portable Ruby here: it
  # probes /etc/os-release and /usr/bin/ldd to detect glibc, neither of
  # which exists on NixOS. The attribute has to be version-pinned — plain
  # `ruby` is 3.4 and brew rejects it.
  "ruby_4_0",
]

# The `journal` loophole: this project asks for its read capability.
# `yolo request journal read` writes this, and `yolo config apply` on the
# host grants it.
[requests.journal]
read = true

# Environment variables set inside the jail.  `[env] sources` takes an
# ordered list of dotenv paths and/or inline `{ set = {...} }` objects; the
# legacy JSONC key was `env_sources`.
[env]
sources = [
  # The other half of the mesa story above.  mesa is in `install.nix`, and
  # /dev/dri is passed through by the `gpu` block below, but the Vulkan
  # loader still found nothing: it searches /usr/share/vulkan/icd.d,
  # /etc/vulkan/icd.d and $XDG_DATA_DIRS, none of which exist or are set
  # in this image, so `vulkaninfo` failed with "Found no drivers!" and the
  # benchmark's GPU column silently vanished.  Everyone who wanted a GPU
  # number exported this by hand first.
  #
  # The path carries NO store hash and so survives an image rebuild:
  # /share is the image's merged tree, a symlink farm regenerated at build
  # time from whatever mesa was baked in, and its icd.d entry always
  # points at that mesa.  (There is no facility for interpolating a
  # package's store path into a value — env_sources values are literal
  # strings — but none is needed, because of that symlink.)
  #
  # It names radeon_icd, not the icd.d DIRECTORY, on purpose.  The loader
  # accepts a directory, but mesa also installs lvp_icd — llvmpipe, a
  # software rasterizer that enumerates as an ordinary VkPhysicalDevice.
  # Pointing at the directory makes llvmpipe a "GPU", and a GPU column
  # fed by it is CPU numbers under a GPU heading: exactly what the
  # proof-of-a-GPU rule in AGENTS.md forbids.  `machine.gpu.vendor` below
  # is "amd", so naming the AMD driver is a fact about this jail, not a
  # guess.  Verify after a restart with:  vulkaninfo --summary
  { set = { VK_ICD_FILENAMES = "/share/vulkan/icd.d/radeon_icd.x86_64.json" } },
]

# security: tool shims injected into the jail's PATH.  Defaults (no
# config needed): grep is blocked only for recursive usage (``-r``,
# ``-R``, ``--recursive``, ``-rn`` etc. — pipe filters and
# single-file greps pass through); find is blocked unconditionally.
# Override only if you want custom rules — the defaults are sane.
# [security]
# blocked_tools = [
#   # Only block when argv contains one of these shell-glob patterns.
#   # Omit block_flags to block unconditionally.
#   { name = "grep", block_flags = ["--recursive", "-r", "-R", "-*[rR]*"] },
#   "find", # string form → unconditional block
#   "curl", # add your own tools here
# ]

# Network mode: "bridge" (the default) gives the jail its own netns.
# [network]
# mode = "bridge"
# Ports to publish in bridge mode, host-first (["Host:Jail"]).
# ports = ["8000:8000"]
# Forward host ports into the jail (appear on localhost inside container),
# jail-first (["Jail:Host"]).
# forward_host_ports = [5432, "8080:9090"]

# Extra tools to install via mise (key: tool name, value: version string).
# Default: {"neovim": "stable"} — override in user or workspace config.
# [install]
# mise = { neovim = "nightly", typst = "latest" }

# Additional language servers for Copilot and Gemini.
# Defaults (always present): python (pyright), typescript, go (gopls).
# Add new servers or override defaults. Binary must be on PATH (e.g., via mise).
# [lsp_servers.rust]
# command = "rust-analyzer"
# args = []
# fileExtensions = { ".rs" = "rust" }

# Enable built-in MCP server presets by name.
# Available presets: chrome-devtools, sequential-thinking
# mcp_presets = ["chrome-devtools", "sequential-thinking"]
# Additional custom MCP servers for Copilot and Gemini.
# Add custom servers or set a preset/inherited server to "off" to disable it.
# Binary must be on PATH or absolute.
# [mcp_servers.my-custom]
# command = "/workspace/scripts/my-mcp-server.py"
# args = []

# AMD ROCm / Vulkan GPU passthrough.
# Passes /dev/kfd and /dev/dri render nodes into the jail for ROCm/Vulkan compute.
[machine.gpu]
enabled = true
vendor = "amd"
mode = "devices"
devices = "all"

# Container resource limits.
# On Apple Container: applied as VM hardware limits (defaults: half host CPUs/RAM).
# On Docker/Podman: applied as --cpus/--memory flags (no defaults — inherits VM limits).
# On Linux: also feeds cgroup delegation for in-container yolo-cglimit.
# [machine.resources]
# memory = "8g"     # Max memory (b/k/m/g suffix). OOM-killed if exceeded.
# cpus = 4          # CPU limit (decimal). e.g. 4, 2.5, "0.5"
# pids_limit = 4096 # Max processes (Docker/Podman only). Prevents fork bombs.
