name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The overlay is CGO against GTK4 and gtk4-layer-shell, so the binary
      # is built on the target platform rather than cross-compiled. mavor only
      # runs under a Wayland compositor, so linux/amd64 is the whole matrix.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgirepository1.0-dev \
            pkg-config

      - uses: jdx/mise-action@v2
        with:
          version: latest
          install: true

      - name: Quality gate
        run: just check-ci

      - name: Build release binary
        run: |
          mkdir -p dist
          go build \
            -ldflags "-X main.Commit=${GITHUB_REF_NAME} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/mavor ./cmd/mavor
          tar -C dist -czf "dist/mavor_${GITHUB_REF_NAME}_linux_amd64.tar.gz" mavor
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/mavor_${GITHUB_REF_NAME}_linux_amd64.tar.gz \
            dist/checksums.txt
