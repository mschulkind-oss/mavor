name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          version: latest
          install: true

      - name: Quality gate
        run: just check-ci

      # Pure Go, so every target cross-compiles from one runner. mavor needs a
      # Wayland compositor, which is why the matrix is Linux only rather than
      # every platform Go can emit.
      - name: Build release binaries
        run: |
          mkdir -p dist
          stamp="-X main.Commit=${GITHUB_REF_NAME} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "$stamp" -o "dist/mavor" ./cmd/mavor
            tar -C dist -czf "dist/mavor_${GITHUB_REF_NAME}_linux_${arch}.tar.gz" mavor
            rm dist/mavor
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/mavor_${GITHUB_REF_NAME}_linux_amd64.tar.gz \
            dist/mavor_${GITHUB_REF_NAME}_linux_arm64.tar.gz \
            dist/checksums.txt
