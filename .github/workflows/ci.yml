name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgirepository1.0-dev \
            pkg-config

      - uses: jdx/mise-action@v2
        with:
          version: latest
          install: true

      - name: Quality Gate (check-ci)
        run: just check-ci
