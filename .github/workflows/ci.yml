name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true

      - name: Quality Gate (check-ci)
        run: just check-ci

  # The integration suite is the only thing that renders the overlay in a real
  # compositor, and every overlay bug that reached a user this week was
  # invisible to check-ci. It ran nowhere but a developer's machine, which
  # meant in practice it ran when someone remembered.
  #
  # Its own job, because it needs a compositor, an audio stack and a dozen
  # packages that the quality gate does not, and because a green check-ci
  # should not depend on any of that being installable.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true

      # sway needs a seat and a runtime dir; the harness runs it headless
      # through WLR_BACKENDS=headless, so no GPU and no display are required.
      - name: Install the compositor and its tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sway grim slurp wtype wl-clipboard \
            libwayland-client0 xkb-data \
            pipewire pipewire-pulse wireplumber pulseaudio-utils \
            dbus dbus-x11

      - name: Integration tests (headless sway)
        env:
          XDG_RUNTIME_DIR: /tmp/mavor-ci-runtime
          WLR_BACKENDS: headless
          WLR_LIBINPUT_NO_DEVICES: "1"
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          just test-int
